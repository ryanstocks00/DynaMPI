---
name: macOS
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
env:
  CMAKE_CXX_STANDARD: 20
  CMAKE_VERBOSE_MAKEFILE: ON
jobs:
  macos-clang:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      matrix:
        build-type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI on macOS
        shell: bash
        run: |
          brew install open-mpi
          echo "MPI_TYPE=OpenMPI" >> $GITHUB_ENV
      - name: Configure CMake on macOS
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DDYNAMPI_BUILD_TESTS=ON \
            -DDYNAMPI_BUILD_BENCHMARKS=ON \
            -DDYNAMPI_MAX_MPI_RANK=8
      - name: Build on macOS
        shell: bash
        run: cmake --build build --config ${{ matrix.build-type }} --parallel
      - name: Test on macOS
        shell: bash
        run: |
          cd build
          echo "Testing with $MPI_TYPE"
          mpiexec --version || true
          export DYNAMPI_MAX_MPI_RANK=8
          # Sequential: concurrent mpiexec oversubscribe on shared macOS
          # runners has been flaky; keep output for the failure comment below.
          if ! ctest --output-on-failure --output-junit TestResults.xml \
              -C ${{ matrix.build-type }} 2>&1 | tee ctest.log; then
            echo "CTEST_FAILED=1" >> "$GITHUB_ENV"
            exit 1
          fi
      - name: Comment ctest failures on PR
        if: failure() && env.CTEST_FAILED == '1' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "### macOS ctest failure (${{ matrix.build-type }})"
            echo
            echo '```'
            # Prefer failed-test excerpts; fall back to the tail of the log.
            if grep -n -E 'FAILED|failed|Error|Assertion|SEGFAULT|TIMEOUT' build/ctest.log \
                | head -n 80; then
              :
            else
              tail -n 120 build/ctest.log
            fi
            echo '```'
          } > /tmp/macos-ctest-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/macos-ctest-comment.md
